      justify-content: center;
      gap: 9px;
      transition: transform .18s ease, box-shadow .18s ease;

    .mode-card span { font-size: .92rem; font-weight: 700; }

    .game-screen { display: none; }
    .game-screen.active { display: flex; flex-direction: column; }

    .game-header {

      margin: 0 auto 16px;

      align-items: center;
      justify-content: space-between;
      gap: 16px;

    .back-button {

      border-radius: 14px;
      min-width: 48px;
      min-height: 44px;
      display: grid;
      place-items: center;
      box-shadow: 0 4px 0 #bddded;
      transition: transform .16s ease;

    .back-button:hover { transform: translateY(-2px); }
    .back-button i { width: 21px; height: 21px; }

    .game-layout {
      width: min(1160px, 100%);

      display: grid;
      grid-template-columns: minmax(235px, 1fr) minmax(300px, 1.35fr) minmax(235px, 1fr);
      align-items: center;
      gap: 20px;

      gap: 7px;
      margin-top: 7px;

    .key {
      min-height: 39px;

      background: #fff;

      font-weight: 800;
      transition: transform .12s ease, background .12s ease;

    .key-clear { background: #ffe2e4; color: #c93245; }
    .key-go { background: #ef4e5c; color: white; }

    .arena {

    .arena::before {
      content: "";

      background-size: 16px 16px;
      opacity: .35;

    .arena-title {

      top: 18px;

      z-index: 2;
      text-align: center;
      font-size: .82rem;
      font-weight: 800;
      color: #2575ad;
      letter-spacing: .07em;
      text-transform: uppercase;
    }
    .center-line {
      position: absolute;
      width: 5px;
      height: 116px;
      left: 50%;
      bottom: 55px;
      transform: translateX(-50%);
      background: repeating-linear-gradient(to bottom, #fff 0 10px, transparent 10px 17px);
      opacity: .9;
    }
    .rope {
      position: absolute;
      z-index: 3;
      left: 9%;
      right: 9%;

      height: 12px;
      border-radius: 20px;
      background: repeating-linear-gradient(45deg, #9a6533 0 6px, #c08a54 6px 12px);
      box-shadow: 0 3px 2px rgba(92, 53, 20, .22);

    .rope-marker {

    .kid-right .body { background: #ef4e5c; }
    .arm {
      position: absolute; width: 62px; height: 15px; top: 77px; border-radius: 16px;
      background: #f5b487; border: 3px solid #174770; transform-origin: left center;
    }
    .arm-a { left: -13px; transform: rotate(14deg); }

    .leg {

    }
    .leg-a { left: 34px; transform: rotate(10deg); }
    .leg-b { left: 65px; transform: rotate(-9deg); }
    @keyframes tug { from { margin-bottom: 0; } to { margin-bottom: 7px; } }

    .winner-card {
      width: min(440px, 100%);
      padding: 35px 26px;
      border-radius: 30px;
      text-align: center;
      box-shadow: 0 14px 0 #bddfed, 0 24px 44px rgba(9,55,89,.28);

    .winner-badge {

      margin: 0 auto 16px; display: grid; place-items: center;
      background: #fff3bf; color: #cc8500;

    .winner-badge i { width: 40px; height: 40px; }
    .winner-card h2 { margin: 0; }
    .winner-player { font-size: 1.18rem; font-weight: 800; margin: 10px 0 22px; }
    .play-again {

      border-radius: 14px;
      box-shadow: 0 4px 0 #c8384b;
      font-weight: 800;

    @media (max-width: 880px) {
      .mode-grid { grid-template-columns: repeat(4, minmax(100px, 1fr)); }

      .arena { grid-column: 1 / -1; order: -1; min-height: 300px; }

      .kid-left { left: 2%; }.kid-right { right: 2%; }
    }
  </style>

      <div class="kid kid-right" aria-hidden="true">

        <div class="eye eye-one"></div>
        <div class="eye eye-two"></div>

     <section data-template-id="right-panel" class="canva-panel player-panel" aria-labelledby="right-player-title">
      <h2 id="right-player-title" data-template-id="right-player-title" class="canva-text"></h2>
      <p class="score-line">Skor: <span id="right-score">0</span>/5</p>
      <div id="right-question" class="question-box" aria-live="polite"></div><label data-template-id="right-answer-label" class="canva-text sr-only" for="right-answer"></label> <input id="right-answer" class="canva-input answer-input" type="text" inputmode="numeric" autocomplete="off">
      <div id="right-status" class="answer-status" aria-live="polite"></div>
      <div class="keypad" data-player="right"><button class="key" type="button">1</button><button class="key" type="button">2</button><button class="key" type="button">3</button> <button class="key" type="button">4</button><button class="key" type="button">5</button><button class="key" type="button">6</button> <button class="key" type="button">7</button><button class="key" type="button">8</button><button class="key" type="button">9</button> <button class="key key-clear" type="button">C</button><button class="key" type="button">0</button><button class="key key-go" type="button">Go</button>
      </div>
     </section>
    </div>
    <footer class="game-footer">
     <p data-template-id="game-tip" class="canva-text game-tip"></p>
     <p data-template-id="creator-text" class="canva-text creator"></p>

  </main>
  <div id="countdown-overlay" class="overlay" aria-live="assertive" aria-label="Hitung mundur permainan">
   <div id="countdown-number" class="count-number">
    3
   </div>
  </div>
  <div id="winner-overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="winner-message">
   <div data-template-id="winner-card" class="canva-card winner-card">
    <div class="winner-badge" aria-hidden="true">
     <i data-lucide="trophy"></i>
    </div>
    <h2 id="winner-message" data-template-id="winner-message" class="canva-text"></h2>
    <p id="winner-player" class="winner-player" aria-live="polite"></p><button id="play-again-button" data-template-id="play-again-button" class="canva-button play-again" type="button"></button>
   </div>
  </div>
  <script src="/_sdk/0aac212797dcb9a6.editing_sdk.js" integrity="sha512-U1Z5TGB/MTX0fFSADhP7rVM3+UzJJjKTapiY1vm1cxcbcyWo4eBuCJNJO6zARJ5kHopP9UvWNtPszOqzRc1ICA=="></script>
  <script>
    const state = {
      mode: "mixed",
      started: false,
      scores: { left: 0, right: 0 },
      questions: { left: null, right: null }
    };

    const $ = (id) => document.getElementById(id);
    const random = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;

    function gcd(a, b) {
      while (b !== 0) [a, b] = [b, a % b];
      return a;
    }

    function lcm(a, b) {
      return Math.abs(a * b) / gcd(a, b);
    }

    function makeQuestion(mode) {
      if (mode === "mixed") {
        const choices = ["add", "subtract", "multiply", "divide", "square", "root", "percent", "length", "time"];
        mode = choices[random(0, choices.length - 1)];
      }

      let a, b, answer, text;
      switch (mode) {
        case "add":
          a = random(15, 90); b = random(10, 85); answer = a + b; text = `${a} + ${b} = ...`; break;
        case "subtract":
          a = random(35, 99); b = random(10, a - 5); answer = a - b; text = `${a} − ${b} = ...`; break;
        case "multiply":
          a = random(3, 12); b = random(3, 12); answer = a * b; text = `${a} × ${b} = ...`; break;
        case "divide":
          b = random(2, 12); answer = random(2, 12); a = b * answer; text = `${a} ÷ ${b} = ...`; break;
        case "square":
          a = random(2, 12); answer = a * a; text = `${a}² = ...`; break;
        case "cube":
          a = random(2, 6); answer = a * a * a; text = `${a}³ = ...`; break;
        case "root":
          answer = random(2, 15); a = answer * answer; text = `√${a} = ...`; break;
        case "cuberoot":
          answer = random(2, 8); a = answer ** 3; text = `³√${a} = ...`; break;
        case "percent":
          a = random(1, 9) * 10; b = random(2, 9) * 10; answer = (a / 100) * b; text = `${a}% dari ${b} = ...`; break;
        case "gcd":
          a = random(2, 10); b = random(2, 10); answer = gcd(a * random(2, 5), b * random(2, 5)); text = `FPB dari ${a * 4} dan ${b * 4} = ...`; answer = 4 * gcd(a, b); break;
        case "lcm":
          a = random(2, 8); b = random(3, 9); answer = lcm(a, b); text = `KPK dari ${a} dan ${b} = ...`; break;
        case "length":
          a = random(2, 9); answer = a * 100; text = `${a} m = ... cm`; break;
        case "weight":
          a = random(2, 8); answer = a * 1000; text = `${a} kg = ... g`; break;
        case "time":
          a = random(2, 9); answer = a * 60; text = `${a} jam = ... menit`; break;
        case "distance":
          a = random(2, 9); answer = a * 1000; text = `${a} km = ... m`; break;
        case "fraction":
          b = random(2, 10); a = random(1, b - 1); answer = a * 10; text = `${a}/${b} dari ${b * 10} = ...`; break;
        case "ratio":
          a = random(2, 8); b = random(2, 8); answer = a + b; text = `Perbandingan ${a}:${b}, jumlah bagian = ...`; break;
        case "negative":
          a = random(4, 18); b = random(4, 18); answer = -a + b; text = `−${a} + ${b} = ...`; break;
        case "average":
          a = random(4, 15); b = random(4, 15); answer = (a + b) / 2; text = `Rata-rata ${a} dan ${b} = ...`; break;
        default:
          answer = 1; text = "1 + 0 = ...";
      }
      return { text, answer };
    }

    function renderQuestion(player) {
      state.questions[player] = makeQuestion(state.mode);
      $(`${player}-question`).textContent = state.questions[player].text;
      $(`${player}-answer`).value = "";
      $(`${player}-status`).textContent = "";
    }

    function playTone(type) {
      try {
        const context = new (window.AudioContext || window.webkitAudioContext)();
        const oscillator = context.createOscillator();
        const gain = context.createGain();
        oscillator.connect(gain);
        gain.connect(context.destination);
        oscillator.type = type === "correct" ? "triangle" : "sawtooth";
        oscillator.frequency.value = type === "correct" ? 660 : 150;
        gain.gain.setValueAtTime(.08, context.currentTime);
        gain.gain.exponentialRampToValueAtTime(.001, context.currentTime + (type === "correct" ? .25 : .14));
        oscillator.start();
        oscillator.stop(context.currentTime + (type === "correct" ? .25 : .14));
      } catch (e) {}
    }

    function updateRope() {
      const pull = (state.scores.right - state.scores.left) * 7;
      document.documentElement.style.setProperty("--rope-shift", `${pull}%`);
    }

    function checkAnswer(player) {
      if (!state.started) return;
      const input = $(`${player}-answer`);
      const submitted = Number(input.value);
      const question = state.questions[player];

      if (input.value.trim() === "") return;

      if (submitted === question.answer) {
        state.scores[player] += 1;
        $(`${player}-score`).textContent = state.scores[player];
        $(`${player}-status`).textContent = "Benar! Tarik talinya!";
        $(`${player}-status`).style.color = "#198754";
        playTone("correct");
        updateRope();

        if (state.scores[player] >= 5) {
          state.started = false;
          setTimeout(() => showWinner(player), 650);
        } else {
          setTimeout(() => renderQuestion(player), 450);
        }
      } else {
        $(`${player}-status`).textContent = "Belum tepat, coba lagi!";
        $(`${player}-status`).style.color = "#d53b4c";
        input.value = "";
        playTone("wrong");
      }
    }

    function showWinner(player) {
      $("winner-player").textContent = player === "left" ? "Pemain Biru memenangkan pertandingan!" : "Pemain Merah memenangkan pertandingan!";
      $("winner-overlay").classList.add("show");
      playTone("correct");
    }

    async function startCountdown() {
      const overlay = $("countdown-overlay");
      const number = $("countdown-number");
      overlay.classList.add("show");

      for (const value of ["3", "2", "1", "Mulai!"]) {
        number.textContent = value;
        number.style.animation = "none";
        void number.offsetWidth;
        number.style.animation = "pop .62s ease both";
        playTone(value === "Mulai!" ? "correct" : "wrong");
        await new Promise(resolve => setTimeout(resolve, value === "Mulai!" ? 800 : 850));
      }

      overlay.classList.remove("show");
      state.started = true;
      $("left-answer").focus();
    }

    function beginGame(mode) {
      state.mode = mode;
      state.scores = { left: 0, right: 0 };
      state.started = false;
      $("left-score").textContent = "0";
      $("right-score").textContent = "0";
      updateRope();
      renderQuestion("left");
      renderQuestion("right");
      $("mode-screen").style.display = "none";
      $("game-screen").classList.add("active");
      startCountdown();
    }

    function returnToModes() {
      state.started = false;
      $("game-screen").classList.remove("active");
      $("mode-screen").style.display = "flex";
      $("winner-overlay").classList.remove("show");
    }

    document.querySelectorAll(".mode-card").forEach(card => {
      card.addEventListener("click", () => beginGame(card.dataset.mode));
    });

    document.querySelectorAll(".keypad").forEach(keypad => {
      keypad.addEventListener("click", (event) => {
        const key = event.target.closest(".key");
        if (!key || !state.started) return;
        const player = keypad.dataset.player;
        const input = $(`${player}-answer`);
        const value = key.textContent.trim();

        if (value === "C") input.value = "";
        else if (value === "Go") checkAnswer(player);
        else if (input.value.length < 8) input.value += value;
        input.focus();
      });
    });

    ["left", "right"].forEach(player => {
      $(`${player}-answer`).addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          event.preventDefault();
          checkAnswer(player);
        }
      });
    });

    $("back-button").addEventListener("click", returnToModes);
    $("play-again-button").addEventListener("click", returnToModes);

    lucide.createIcons();
  </script>
 </body>
